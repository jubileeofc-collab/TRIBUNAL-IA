name: Gerar APK TRIBUNAL IA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'TRIBUNAL_IA_2_0_PROJETO_COMPLETO.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extrair projeto
        run: |
          mkdir -p source
          unzip -q TRIBUNAL_IA_2_0_PROJETO_COMPLETO.zip -d source

      - name: Localizar projeto Gradle
        shell: bash
        run: |
          SETTINGS_FILE=$(find source -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: projeto Gradle não encontrado."
            find source -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIBUNAL-IA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
