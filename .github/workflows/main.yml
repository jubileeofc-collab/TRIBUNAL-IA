name: Gerar APK TRIBUNAL IA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir -p source
          unzip -q TRIBUNAL_IA_2_0_PROJETO_COMPLETO.zip -d source

      - name: Compilar APK
        working-directory: source
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIBUNAL-IA-APK
          path: source/app/build/outputs/apk/debug/*.apk
